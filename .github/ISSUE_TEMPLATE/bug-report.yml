name: Bug report
description: Report a Hollow Sols problem and attach the prepared diagnostic ZIP.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and attach the ZIP prepared by the game's failure dialog.
        Reports are public when the repository is public. Inspect the ZIP before sharing.
        Do not attach saves, game files, passwords, tokens or unrelated logs.
        Preparing a report in the game does not upload it or submit an issue.
  - type: input
    id: build
    attributes:
      label: Mod build and game versions
      description: Include both game versions and the mod build. The report ZIP also records build identity.
    validations:
      required: true
  - type: input
    id: incident
    attributes:
      label: Incident ID
      description: Prefilled for bridge failure reports; otherwise leave blank.
  - type: textarea
    id: failure
    attributes:
      label: What happened?
      description: Describe the failure and any message shown by either game.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result
      description: What were you doing, what did you expect, and can you reproduce it?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic ZIP and optional screenshots
      description: Drag the prepared HollowSols-report ZIP into this field. GitHub may require you to sign in.
      placeholder: Attach this ZIP, describe what happened, then submit.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I reviewed the attachments and removed private or unrelated information.
          required: true
